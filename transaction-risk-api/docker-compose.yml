services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: riskdb
      POSTGRES_USER: riskuser
      POSTGRES_PASSWORD: riskpass
    ports:
      - "5432:5432"
    volumes:
      - risk_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U riskuser -d riskdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: riskdb
      DB_USER: riskuser
      DB_PASSWORD: riskpass
    ports:
      - "8080:8080"

volumes:
  risk_pg_data:
